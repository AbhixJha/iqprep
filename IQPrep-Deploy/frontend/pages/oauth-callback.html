<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQPrep — Signing you in</title>
<meta name="theme-color" content="#08090D">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M0%200h32v22l-10%2010H0z%22%20fill%3D%22%23F59E0B%22/%3E%3Crect%20x%3D%226%22%20y%3D%2217%22%20width%3D%224.4%22%20height%3D%229%22%20fill%3D%22%2308090D%22/%3E%3Crect%20x%3D%2213.8%22%20y%3D%2210%22%20width%3D%224.4%22%20height%3D%2216%22%20fill%3D%22%2308090D%22/%3E%3Crect%20x%3D%2221.6%22%20y%3D%225%22%20width%3D%224.4%22%20height%3D%2221%22%20fill%3D%22%2308090D%22/%3E%3Crect%20x%3D%2221.6%22%20y%3D%225%22%20width%3D%224.4%22%20height%3D%224.4%22%20fill%3D%22%2300F0FF%22/%3E%3C/svg%3E">
</head>
<body data-motion="lite">
<div class="cur"></div><div class="cur-ring"></div>
<div class="cb-wrap">
<div class="cb-box stag">
      <div class="brand" style="margin-bottom:1.2rem"><span class="brand-mark"><svg class="logo-svg" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="6" y="17" width="4.4" height="9" fill="#08090D"/><rect x="13.8" y="10" width="4.4" height="16" fill="#08090D"/><rect x="21.6" y="5" width="4.4" height="21" fill="#08090D"/><rect x="21.6" y="5" width="4.4" height="4.4" fill="#00F0FF"/></svg></span>IQPrep</div>
  <div class="cb-bars"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="cb-title">Signing<br>you in.</div>
  <div class="cb-sub">Hold on while the account is connected.</div>
  <div class="cb-status" id="cb-status">Reading authorization code...</div>
  <div class="cb-error" id="cb-error"></div>
  <div class="cb-debug" id="cb-debug"></div>
  <button class="btn btn-v cb-back" id="cb-back" onclick="window.location.href='login.html'">Back to login</button>
</div>
</div>
<script src="../js/utils.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
// ── Read URL params ───────────────────────────────────────────
const params   = new URLSearchParams(window.location.search);
const code     = params.get('code');
const errParam = params.get('error');
const provider = localStorage.getItem('iq3_oauth_provider') || 'google';

function setStatus(msg){ document.getElementById('cb-status').textContent = msg; }

function showError(msg, debugInfo){
  setStatus('Authentication failed');
  const el = document.getElementById('cb-error');
  el.innerHTML = msg;
  el.style.display = 'block';
  document.getElementById('cb-back').style.display = 'inline-block';
  if(debugInfo){
    const dbg = document.getElementById('cb-debug');
    dbg.textContent = debugInfo;
    dbg.style.display = 'block';
  }
}

function debug(msg){ console.log('[OAuth]', msg); }

async function handleCallback(){
  debug('Provider: ' + provider);
  debug('Code present: ' + !!code);
  debug('Error param: ' + errParam);

  // ── Error from provider ──────────────────────────────────
  if(errParam){
    showError(
      'Sign-in was cancelled or denied by ' + provider + '.<br><br>' +
      'Reason: <code>' + errParam + '</code><br><br>' +
      'Click "Back to Login" and try again.',
      'error_param=' + errParam
    );
    return;
  }

  // ── No code received ─────────────────────────────────────
  if(!code){
    // Check if this page was opened directly (not from OAuth redirect)
    showError(
      'No authorization code found in URL.<br><br>' +
      'This usually means:<br>' +
      '• The OAuth redirect URI is wrong in Google/GitHub console<br>' +
      '• You opened this page directly instead of clicking the button<br><br>' +
      'Expected redirect URI: <code>' + window.location.origin + window.location.pathname + '</code>',
      'URL: ' + window.location.href
    );
    return;
  }

  setStatus('Connecting to backend...');
  debug('Code: ' + code.substring(0,10) + '...');

  // ── Send code to backend ──────────────────────────────────
  try{
    const endpoint = provider === 'github'
      ? '/auth/oauth/github/callback'
      : '/auth/oauth/google/callback';

    debug('Calling: ' + endpoint);
    setStatus('Verifying with ' + (provider === 'github' ? 'GitHub' : 'Google') + '...');

    const data = await apiFetch(endpoint, {
      method: 'POST',
      body:   JSON.stringify({ code })
    });

    debug('Got token: ' + !!data.token);

    // ── Save user exactly like normal login ───────────────
    setToken(data.token);
    S.set('iq3_user', {
      id:            data.id,
      firstName:     data.firstName,
      lastName:      data.lastName,
      email:         data.email,
      roles:         data.roles,
      targetRole:    data.targetRole,
      totalSessions: data.totalSessions,
      averageScore:  data.averageScore
    });

    localStorage.removeItem('iq3_oauth_provider');
    setStatus('Logged in as ' + data.firstName + '! Redirecting...');
    setTimeout(() => window.location.href = 'dashboard.html', 1000);

  } catch(err){
    debug('Error: ' + err.message);

    let friendlyMsg = 'Login failed.<br><br>';

    if(err.message && err.message.includes('503')){
      friendlyMsg +=
        '<strong>OAuth not configured yet.</strong><br>' +
        'Add the Google or GitHub client id and secret to the backend environment variables.';
    } else if(err.message && err.message.includes('404')){
      friendlyMsg +=
        '<strong>Backend endpoint not found.</strong><br>' +
        'The API URL in js/config.js may be wrong.';
    } else if(err.message && err.message.toLowerCase().includes('network') || err.message.includes('fetch')){
      friendlyMsg +=
        '<strong>Cannot reach the server.</strong><br>' +
        'Free hosting sleeps when idle. Wait about 30 seconds and try again.';
    } else {
      friendlyMsg += (err.message || 'Unknown error. Check browser console (F12).');
    }

    showError(friendlyMsg, 'Error: ' + err.message + '\nProvider: ' + provider + '\nCode: ' + (code || 'none').substring(0,15));
  }
}

handleCallback();
</script>
<script src="../js/motion.js"></script>

</body>
</html>
