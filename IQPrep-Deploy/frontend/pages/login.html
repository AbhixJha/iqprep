<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQPrep — Sign in</title>
<meta name="theme-color" content="#08090D">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M0%200h32v22l-10%2010H0z%22%20fill%3D%22%23F59E0B%22/%3E%3Crect%20x%3D%226%22%20y%3D%2217%22%20width%3D%224.4%22%20height%3D%229%22%20fill%3D%22%2308090D%22/%3E%3Crect%20x%3D%2213.8%22%20y%3D%2210%22%20width%3D%224.4%22%20height%3D%2216%22%20fill%3D%22%2308090D%22/%3E%3Crect%20x%3D%2221.6%22%20y%3D%225%22%20width%3D%224.4%22%20height%3D%2221%22%20fill%3D%22%2308090D%22/%3E%3Crect%20x%3D%2221.6%22%20y%3D%225%22%20width%3D%224.4%22%20height%3D%224.4%22%20fill%3D%22%2300F0FF%22/%3E%3C/svg%3E">
</head>
<body data-motion="lite">
<div class="cur"></div><div class="cur-ring"></div>
<div class="auth-page">
  <aside class="auth-art">
    <canvas id="arena" data-mode="auth" aria-hidden="true"></canvas>
    <a href="../index.html" class="brand"><span class="brand-mark"><svg class="logo-svg" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="6" y="17" width="4.4" height="9" fill="#08090D"/><rect x="13.8" y="10" width="4.4" height="16" fill="#08090D"/><rect x="21.6" y="5" width="4.4" height="21" fill="#08090D"/><rect x="21.6" y="5" width="4.4" height="4.4" fill="#00F0FF"/></svg></span>IQPrep</a>
    <div>
      <div class="art-title">Back for<br><em>round two.</em></div>
      <ul class="art-list"><li>Scored answers</li><li>Voice and video rounds</li><li>Your history, saved</li></ul>
    </div>
  </aside>
  <main class="auth-form stag">
    <a href="../index.html" class="brand m-brand"><span class="brand-mark"><svg class="logo-svg" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="6" y="17" width="4.4" height="9" fill="#08090D"/><rect x="13.8" y="10" width="4.4" height="16" fill="#08090D"/><rect x="21.6" y="5" width="4.4" height="21" fill="#08090D"/><rect x="21.6" y="5" width="4.4" height="4.4" fill="#00F0FF"/></svg></span>IQPrep</a>
    <div class="fh"><h2>Welcome back.</h2><p>Sign in and pick up where you left off.</p></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab on" onclick="switchTab('password',this)">Password</button>
      <button class="tab" onclick="switchTab('otp',this)">One-time code</button>
    </div>

    <!-- ══ PASSWORD LOGIN ══ -->
    <div id="tab-password">
      <div class="fg">
        <label>Email</label>
        <div class="iw"><i class="ic fa-regular fa-envelope"></i><input class="fi" type="email" id="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')login()"></div>
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="iw"><i class="ic fa-solid fa-lock"></i>
          <input class="fi" type="password" id="pass" placeholder="Your password" onkeydown="if(event.key==='Enter')login()">
          <button onclick="togglePw('pass',this)" style="background:none;border:none;color:var(--white-3);cursor:pointer;padding:0 12px;font-size:.8rem;position:absolute;right:0;top:50%;transform:translateY(-50%)"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <a href="#" class="forgot" onclick="showForgotPassword(event)">Forgot password?</a>
      <button class="btn-auth" id="login-btn" onclick="login()">
        Sign in
      </button>
      <div class="sep">or continue with</div>
      <div class="socials">
        <button class="btn-soc google" id="google-btn" onclick="loginWithGoogle()">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button class="btn-soc github" id="github-btn" onclick="loginWithGitHub()">
          <i class="fa-brands fa-github"></i> GitHub
        </button>
      </div>
    </div>

    <!-- ══ OTP LOGIN ══ -->
    <div id="tab-otp" style="display:none">

      <!-- Step 1: Enter email/phone -->
      <div id="otp-step-1">
        <div class="fg">
          <label>Email or Phone</label>
          <div class="iw">
            <i class="ic fa-regular fa-envelope"></i>
            <input class="fi" type="text" id="otp-contact" placeholder="Email or +91XXXXXXXXXX" onkeydown="if(event.key==='Enter')sendOTP()">
          </div>
        </div>
        <button class="btn-auth" id="otp-send-btn" onclick="sendOTP()">
          Send code
        </button>
      </div>

      <!-- Step 2: Enter OTP -->
      <div id="otp-step-2" style="display:none">
        <div style="text-align:center;margin-bottom:1rem">
          <div style="font-size:.82rem;color:var(--white-3)">Code sent to <span id="otp-sent-to" style="color:var(--violet-bright);font-weight:600"></span></div>
          <div style="font-size:.72rem;color:var(--white-3);margin-top:.3rem">Enter the 6-digit code</div>
          <div style="font-size:.7rem;color:var(--white-3);margin-top:.5rem">
            Expires in: <span id="otp-timer" style="color:var(--amber);font-family:var(--font-mono);font-weight:700">10:00</span>
          </div>
        </div>
        <div class="otp-inputs">
          <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp1" oninput="otpNext(this,'otp2')" onkeydown="otpBack(event,this,'')">
          <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp2" oninput="otpNext(this,'otp3')" onkeydown="otpBack(event,this,'otp1')">
          <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp3" oninput="otpNext(this,'otp4')" onkeydown="otpBack(event,this,'otp2')">
          <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp4" oninput="otpNext(this,'otp5')" onkeydown="otpBack(event,this,'otp3')">
          <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp5" oninput="otpNext(this,'otp6')" onkeydown="otpBack(event,this,'otp4')">
          <input class="otp-input" type="text" maxlength="1" inputmode="numeric" id="otp6" oninput="otpNext(this,'')" onkeydown="otpBack(event,this,'otp5')">
        </div>
        <button class="btn-auth" id="otp-verify-btn" onclick="verifyOTP()">
          Verify and sign in
        </button>
        <div style="text-align:center;margin-top:.75rem;display:flex;align-items:center;justify-content:center;gap:.75rem">
          <button onclick="resetOTP()" style="background:none;border:none;color:var(--white-3);font-size:.75rem;cursor:pointer;font-family:inherit">Change contact</button>
          <span style="color:var(--border);font-size:.8rem">|</span>
          <button id="resend-btn" onclick="sendOTP(true)" style="background:none;border:none;color:var(--violet-bright);font-size:.75rem;cursor:pointer;font-family:inherit">Resend code</button>
        </div>
      </div>
    </div>

    <div class="switch-link">Don't have an account? <a href="register.html">Create one</a></div>
  </main>
</div>
<div class="tc"></div>
<script src="../js/utils.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
if(getToken()&&S.get('iq3_user')) window.location.href='dashboard.html';

// ── Tab switching ────────────────────────────────────
function switchTab(tab, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tab-password').style.display = tab==='password' ? 'block' : 'none';
  document.getElementById('tab-otp').style.display      = tab==='otp'      ? 'block' : 'none';
}

// ── Show/hide password ───────────────────────────────
function togglePw(id, btn){
  const inp = document.getElementById(id);
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  btn.innerHTML = isHidden ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
}

// ── Password Login ───────────────────────────────────
async function login(){
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  if(!email||!pass){ toast('Missing fields','Fill in all fields.','w'); return; }

  const btn = document.getElementById('login-btn');
  btn.innerHTML = 'Signing in...';
  btn.disabled = true;

  try{
    await Auth.login({email, password: pass});
    toast('Welcome back','Signed in.','s');
    setTimeout(()=>window.location.href='dashboard.html', 900);
  }catch(err){
    toast('Login failed', err.message, 'e');
    btn.innerHTML = 'Sign in';
    btn.disabled = false;
  }
}

// ── Google OAuth ─────────────────────────────────────
async function loginWithGoogle(){
  const btn = document.getElementById('google-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

  try{
    const data = await apiFetch('/auth/oauth/google/url');
    localStorage.setItem('iq3_oauth_provider','google');
    window.location.href = data.url;
  }catch(err){
    toast('Google OAuth not configured', 'Add Google credentials to application.properties', 'w', 6000);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-brands fa-google"></i> Google';
  }
}

// ── GitHub OAuth ─────────────────────────────────────
async function loginWithGitHub(){
  const btn = document.getElementById('github-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';

  try{
    const data = await apiFetch('/auth/oauth/github/url');
    localStorage.setItem('iq3_oauth_provider','github');
    window.location.href = data.url;
  }catch(err){
    toast('GitHub OAuth not configured', 'Add GitHub credentials to application.properties', 'w', 6000);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-brands fa-github"></i> GitHub';
  }
}

// ── OTP Logic ────────────────────────────────────────
let otpContact = '';
let otpTimerInterval = null;

function otpNext(el, nextId){
  el.classList.toggle('filled', el.value.length > 0);
  if(el.value.length===1 && nextId) document.getElementById(nextId).focus();
  const allFilled = ['otp1','otp2','otp3','otp4','otp5','otp6'].every(id=>document.getElementById(id).value);
  if(allFilled) setTimeout(verifyOTP, 300);
}

function otpBack(e, el, prevId){
  el.classList.toggle('filled', el.value.length > 0);
  if(e.key==='Backspace' && !el.value && prevId) document.getElementById(prevId).focus();
}

function startOtpTimer(){
  clearInterval(otpTimerInterval);
  let secs = 600; // 10 minutes
  const el = document.getElementById('otp-timer');
  otpTimerInterval = setInterval(()=>{
    secs--;
    const m = String(Math.floor(secs/60)).padStart(2,'0');
    const s = String(secs%60).padStart(2,'0');
    el.textContent = `${m}:${s}`;
    if(secs<=60) el.style.color = 'var(--red)';
    if(secs<=0){
      clearInterval(otpTimerInterval);
      el.textContent = 'Expired';
      toast("OTP expired","Please request a new OTP.",'w');
    }
  },1000);
}

function resetOTP(){
  clearInterval(otpTimerInterval);
  document.getElementById('otp-step-1').style.display='block';
  document.getElementById('otp-step-2').style.display='none';
  ['otp1','otp2','otp3','otp4','otp5','otp6'].forEach(id=>{
    const el=document.getElementById(id);
    el.value='';el.classList.remove('filled');
  });
  document.getElementById('otp-timer').style.color='var(--amber)';
}

async function sendOTP(isResend = false){
  otpContact = document.getElementById('otp-contact').value.trim();
  if(!otpContact){ toast('Required','Enter your email or phone number.','w'); return; }

  const btn = document.getElementById('otp-send-btn');
  const resendBtn = document.getElementById('resend-btn');
  if(btn) { btn.innerHTML='Sending...'; btn.disabled=true; }
  if(resendBtn) { resendBtn.textContent='Sending...'; resendBtn.disabled=true; }

  try{
    const data = await apiFetch('/auth/otp/send',{
      method:'POST',
      body: JSON.stringify({ contact: otpContact })
    });

    document.getElementById('otp-step-1').style.display='none';
    document.getElementById('otp-step-2').style.display='block';
    document.getElementById('otp-sent-to').textContent = otpContact;

    // Show OTP in toast for dev (devOtp comes from backend in dev mode)
    if(data.devOtp){
      toast('OTP sent', `Dev OTP: ${data.devOtp}`, 's', 15000);
    }else{
      toast('OTP sent', `Check your ${otpContact.includes('@')?'email':'phone'}`, 's');
    }

    startOtpTimer();
    ['otp1','otp2','otp3','otp4','otp5','otp6'].forEach(id=>{
      const el=document.getElementById(id);el.value='';el.classList.remove('filled');
    });
    document.getElementById('otp-timer').style.color='var(--amber)';
    document.getElementById('otp1').focus();

  }catch(err){
    toast('Failed to send OTP', err.message, 'e');
  }finally{
    if(btn){ btn.innerHTML='Send code'; btn.disabled=false; }
    if(resendBtn){ resendBtn.textContent='Resend code'; resendBtn.disabled=false; }
  }
}

async function verifyOTP(){
  const entered = ['otp1','otp2','otp3','otp4','otp5','otp6'].map(id=>document.getElementById(id).value).join('');
  if(entered.length<6){ toast('Incomplete','Enter all 6 digits.','w'); return; }

  const btn = document.getElementById('otp-verify-btn');
  btn.innerHTML = 'Verifying...';
  btn.disabled = true;

  try{
    const data = await apiFetch('/auth/otp/verify',{
      method:'POST',
      body: JSON.stringify({ contact: otpContact, otp: entered })
    });

    // Store token + user same as password login
    setToken(data.token);
    S.set('iq3_user',{
      id:            data.id,
      firstName:     data.firstName,
      lastName:      data.lastName,
      email:         data.email,
      roles:         data.roles,
      targetRole:    data.targetRole,
      totalSessions: data.totalSessions,
      averageScore:  data.averageScore
    });

    clearInterval(otpTimerInterval);
    toast('Verified','Logging you in...','s');
    setTimeout(()=>window.location.href='dashboard.html',900);

  }catch(err){
    toast('Wrong OTP', err.message||'Invalid or expired code.', 'e');
    ['otp1','otp2','otp3','otp4','otp5','otp6'].forEach(id=>{
      const el=document.getElementById(id);el.value='';el.classList.remove('filled');
    });
    document.getElementById('otp1').focus();
    btn.innerHTML='Verify and sign in';
    btn.disabled=false;
  }
}

// ── Forgot Password (basic modal) ───────────────────
function showForgotPassword(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const entered=prompt('Enter your registered email to reset password:',email||'');
  if(!entered) return;
  toast('Reset link sent!','Check your email for a password reset link (coming soon).','i',5000);
}
</script>
<script src="../js/motion.js"></script>
<script type="module" src="../js/arena.js"></script>
</body>
</html>
